<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rundagio 87 website</title>
  <meta name="description" content="Rundagio 87 website">
  <meta name="theme-color" content="#120d07">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:title" content="Rundagio 87">
  <meta property="og:image" content="/assets/rundagio-1000.png">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <img class="logo"
         src="assets/rundagio-1000.png"
         alt="Rundagio 87 logo: a cat paw gripping a motorcycle handlebar and mirror">
    <nav aria-label="Rundagio links">
      <a class="link" href="/photos">
        <!-- camera -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
          <circle cx="12" cy="13" r="3.6"/>
        </svg>
        <span>Photos</span>
      </a>
      <a class="link insta" href="/instagram">
        <!-- instagram glyph -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5.2"/>
          <circle cx="12" cy="12" r="4.1"/>
          <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <span>Instagram</span>
      </a>
    </nav>
  </main>
</body>
</html>
